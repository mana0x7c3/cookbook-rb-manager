---
driver:
  name: dokken
  privileged: true

transport:
  name: dokken

provisioner:
  name: chef_zero
  install_strategy: skip
  cookbook_path:
    - /opt/kitchen/cookbooks

verifier:
  name: inspec
  chef_license: accept-no-persist

platforms:
  - name: rockylinux-9
    driver:
      image: dokken/rockylinux-9

suites:
  - name: upload
    provisioner:
      run_list: []
    verifier:
      inspec_tests:
        - test/integration/upload
